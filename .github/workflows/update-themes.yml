name: Update theme gallery

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC = 11:17 Beijing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build theme data
        run: python3 Scripts/build_themes.py

      - name: Commit if changed
        run: |
          git config user.name "theme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add themes.json assets/themes
          if git diff --cached --quiet; then
            echo "No theme changes."
          else
            git commit -m "Sync theme gallery from OverGrow-Theme ($(date -u +%F))"
            git push
          fi
